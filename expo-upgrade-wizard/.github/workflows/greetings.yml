name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Welcome to Expo Upgrade Wizard! Thanks for opening your first issue.
            
            A maintainer will review it soon. Meanwhile:
            - Check our [documentation](https://github.com/expo-upgrade-wizard/expo-upgrade-wizard#readme)
            - Join [discussions](https://github.com/expo-upgrade-wizard/expo-upgrade-wizard/discussions)
            - Read our [contributing guide](https://github.com/expo-upgrade-wizard/expo-upgrade-wizard/blob/main/CONTRIBUTING.md)
            
            We appreciate your contribution! 🚀
          pr-message: |
            🎉 Awesome! Thanks for your first pull request!
            
            Please ensure:
            - [ ] Code follows our style guide
            - [ ] All tests pass
            - [ ] Documentation is updated
            - [ ] Commit messages are clear
            
            A maintainer will review your PR soon. Thanks for contributing! 💪
