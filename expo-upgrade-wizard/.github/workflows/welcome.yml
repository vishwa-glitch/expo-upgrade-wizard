name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Thanks for opening your first issue! We appreciate your contribution to Expo Upgrade Wizard.
            
            A maintainer will review your issue soon. In the meantime:
            - Make sure you've provided all the requested information
            - Check our [documentation](https://github.com/expo-upgrade-wizard/expo-upgrade-wizard#readme)
            - Join our [discussions](https://github.com/expo-upgrade-wizard/expo-upgrade-wizard/discussions) for questions
            
            We're excited to help you! 🚀
          
          pr-message: |
            🎉 Thanks for opening your first pull request! We're thrilled to have your contribution.
            
            A maintainer will review your PR soon. Please make sure:
            - [ ] Your code follows our style guidelines
            - [ ] You've tested your changes
            - [ ] You've updated relevant documentation
            - [ ] All CI checks pass
            
            Check out our [Contributing Guide](https://github.com/expo-upgrade-wizard/expo-upgrade-wizard/blob/main/CONTRIBUTING.md) for more information.
            
            Thanks for making Expo upgrades better for everyone! 💪
